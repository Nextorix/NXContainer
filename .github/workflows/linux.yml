name: Linux 原生验收

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      NXCONTAINER_REQUIRE_RUNTIME: '1'
      NXCONTAINER_REQUIRE_LINUX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          # go.mod 记录兼容下限；分发产物使用当前受支持的稳定工具链。
          go-version: stable
          cache-dependency-path: native/go.sum
      - name: 准备隔离后端
        run: |
          test "$(id -u)" -ne 0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
      - name: 原生测试与静态检查
        run: |
          npm run test:native
          npm run check:native
      - name: 构建分发包所需执行器
        run: npm run build:all
      - name: 强制执行 Linux 集成测试
        run: npm test
      - name: 仓库外打包和离线安装验收
        run: npm run test:package
      - name: 扫描四个实际分发的执行器
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          GOBIN="$RUNNER_TEMP" go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$RUNNER_TEMP/govulncheck" -version
          for target in win32-x64.exe win32-arm64.exe linux-x64 linux-arm64; do
            "$RUNNER_TEMP/govulncheck" -mode=binary "bin/nxcontainer-$target"
          done
